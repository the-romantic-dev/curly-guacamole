paths:
  run_name: pvt_v2_b2_segformer_mixed_original

seed: 42

model:
  encoder_name: pvt_v2_b2
  decoder_name: segformer
  decoder_kwargs:
    embed_dim: 128
  forensic_channels: [64, 96, 128]
  aux_weight: 0.4
  norm: batch

augmentation:
  crop_scale_range: [0.35, 1.0]
  jpeg_recompression_probability: 0.3
  jpeg_recompression_quality_range: [60, 100]
  full_frame: false
  full_frame_probability: 0.5
  foreground_crop_probability: 0.5
  final_full_frame_epochs: 2

dataset:
  fold: 0
  n_folds: 5
  image_size: 640

train:
  device: cuda
  workers: 10
  encoder_lr: 0.0001
  fmap_lr: 0.0003
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 8
  epoch_size: 24000
  val_frac: 0.25
  val_keep_negatives: true
  negative_fraction: 0.25
  batch_size: 4
  accum_steps: 4
  warmup_frac: 0.05
  min_lr_factor: 0.02
  amp: bf16
  ema_decay: 0.999
  grad_clip: 1.0
  resume: false

eval:
  resolution: original
  n_bins: 256
  mask_thresholds:
    - 0.05
    - 0.075
    - 0.1
    - 0.125
    - 0.15
    - 0.175
    - 0.2
    - 0.225
    - 0.25
    - 0.275
    - 0.3
    - 0.325
    - 0.35
    - 0.375
    - 0.4
    - 0.425
    - 0.45
    - 0.475
    - 0.5
    - 0.525
    - 0.55
    - 0.575
    - 0.6
    - 0.625
    - 0.65
    - 0.675
    - 0.7
    - 0.725
    - 0.75
    - 0.775
    - 0.8
    - 0.825
    - 0.85
    - 0.875
    - 0.9
    - 0.925
    - 0.95
  cls_thresholds: [0.0, 0.2, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95]
  min_areas: [0.0]

