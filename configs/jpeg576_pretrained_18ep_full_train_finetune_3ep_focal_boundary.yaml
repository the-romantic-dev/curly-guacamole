extends: jpeg576_pretrained_18ep_full_train_finetune_3ep.yaml
paths:
  run_name: jpeg576_pretrained_18ep_full_train_finetune_3ep_focal_boundary
# Inherits parent last.pt initialization, fresh optimizer/EMA, three complete
# training passes, full-frame augmentation and the existing fine-tune LRs.
loss:
  pixel_loss: focal
  focal_gamma: 1.0
  dice_scope: all
  dice_weight: 1.0
  dice_area_reference: 0.05
  dice_area_max_weight: 3.0
  # Signed distances are normalized by the valid image diagonal.
  boundary_weight: 1.0
  # Retain aux modules for strict checkpoint loading, but no auxiliary loss.
  aux_loss_weight: 0.0
