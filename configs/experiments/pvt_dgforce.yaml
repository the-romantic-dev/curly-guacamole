# PVT-v2-B2 with DG-Force DFDG in all 3/4/6 blocks of stages 1-3.
# Budget: 640 -> 105.348 GFLOPs at native 1080x1920 (over 100); the largest
# RGB size (step 8) under 100 is 624 -> 98.987. See pvt_dgforce_640_tr8_aw64.
extends: ../baseline.yaml
run_name: pvt_dgforce
model:
  architecture: pvt_dgforce
  dgforce_reduction: 16
  dgforce_attention_width: 128
  dgforce_attention_heads: 4
  dgforce_transfer_reduction: 4
loss:
  mode: dgforce
  mask_weight: 2.0
  patch_weight: 1.0
  edge_weight: 1.0
  edge_band: 3
  dice_weight: 0.0
  aux_weight: 0.0
