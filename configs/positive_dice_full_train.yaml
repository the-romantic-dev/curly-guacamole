extends: positive_dice.yaml
paths:
  run_name: positive_dice_full_train
train:
  # Four sampled epochs, then one complete shuffled pass without replacement.
  epochs: 5
  epoch_size: 24000
  full_train_epochs: 1
  # Warmup is 5% of the four sampled epochs (0.2 epoch), then constant LR.
  # The final pass cosine-decays from base LR to 10% of base LR.
  warmup_frac: 0.05
  min_lr_factor: 0.1
  resume: false
augmentation:
  final_full_frame_epochs: 1
